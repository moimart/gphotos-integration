<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a73e8"/>
      <stop offset="1" stop-color="#0d47a1"/>
    </linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fef3a3"/>
      <stop offset="1" stop-color="#f6b73c"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="48" fill="url(#bg)"/>

  <!-- Photo frame -->
  <g transform="translate(48 64)">
    <rect x="0" y="0" width="160" height="120" rx="10" fill="#ffffff"/>
    <rect x="8" y="8" width="144" height="104" rx="6" fill="url(#sky)"/>
    <!-- Mountain silhouette -->
    <path d="M8 96 L52 50 L82 80 L108 56 L152 96 Z" fill="#2e7d32"/>
    <!-- Sun -->
    <circle cx="120" cy="36" r="14" fill="#ff7043"/>
  </g>

  <!-- Rotation arrow ring -->
  <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
    <path d="M 200 128 A 90 90 0 1 1 56 128"/>
    <!-- Arrowhead -->
    <path d="M 196 110 L 208 128 L 188 134" stroke-linejoin="round"/>
  </g>
</svg>
