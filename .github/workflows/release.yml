name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync manifest version with tag
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          manifest="custom_components/gphotos_rotator/manifest.json"
          python - <<PY
          import json, pathlib
          p = pathlib.Path("$manifest")
          d = json.loads(p.read_text())
          d["version"] = "$tag"
          p.write_text(json.dumps(d, indent=2) + "\n")
          PY
          echo "Manifest version set to $tag"
          cat "$manifest"

      - name: Create release zip
        run: |
          cd custom_components/gphotos_rotator
          zip -r ../../gphotos_rotator.zip .

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: gphotos_rotator.zip
